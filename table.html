<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All spots — Bangalore Trip Tracker</title>
<meta name="description" content="Every spot around Bangalore in a sortable, searchable table.">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="app.css">
</head>
<body>

<nav class="gnav">
  <div class="gnav-in"><span class="brand"><b>Bangalore</b> Trip Tracker</span></div>
</nav>
<div class="subnav">
  <div class="subnav-in">
    <span class="subnav-title">All spots</span>
    <div class="subnav-links">
      <a href="index.html" id="back">Explore</a>
      <a href="table.html" aria-current="page">All spots</a>
      <a href="plan.html">Plan a trip</a>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="toolbar">
    <div class="search-row">
      <input class="search" id="q" type="search" inputmode="search"
             placeholder="Search name or type…" aria-label="Search spots by name or type">
      <button class="filter-toggle" id="filter-toggle" type="button" aria-expanded="false" aria-controls="filters">
        Filters<span class="badge" id="filter-badge" hidden>0</span>
      </button>
    </div>

    <div class="panel" id="filters" hidden>
      <div class="field">
        <span class="label" id="lbl-status">Status</span>
        <div class="chips" id="f-status" role="group" aria-labelledby="lbl-status"></div>
      </div>
      <div class="field">
        <span class="label" id="lbl-band">Trip length</span>
        <div class="chips" id="f-band" role="group" aria-labelledby="lbl-band"></div>
      </div>
      <div class="field">
        <span class="label" id="lbl-type">Type</span>
        <div class="chips" id="f-type" role="group" aria-labelledby="lbl-type"></div>
      </div>
    </div>
  </div>

  <div class="count-row">
    <span class="count" id="count" role="status" aria-live="polite"></span>
    <button class="reset" id="reset" type="button" hidden>Clear search and filters</button>
  </div>

  <main id="main">
    <div class="tbl-scroll">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </main>

  <footer>
    Tap a column heading to sort, tap again to reverse. Spot names open Google Maps.
    <a href="index.html">← Back to Explore</a>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var BANDS = [
    { id: "in-city",   label: "In city" },
    { id: "half-day",  label: "Half day" },
    { id: "full-day",  label: "Full day" },
    { id: "overnight", label: "Overnight" }
  ];
  var BAND_ORDER = {};
  BANDS.forEach(function (b, i) { BAND_ORDER[b.id] = i; });

  var COLUMNS = [
    { key: "name",   label: "Spot",        type: "text" },
    { key: "km",     label: "km",          type: "num"  },
    { key: "band",   label: "Trip length", type: "ord"  },
    { key: "status", label: "Status",      type: "text" },
    { key: "types",  label: "Types",       type: "text" }
  ];

  var spots = [];
  var allTypes = [];
  var state = {
    q: "",
    status: new Set(),
    bands: new Set(),
    types: new Set(),
    sort: "km",
    dir: 1            // 1 asc, -1 desc
  };

  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- URL state: carries filters over from Explore, and makes a
     filtered table shareable / reloadable ---------- */

  function readUrl() {
    var p = new URLSearchParams(location.search);
    state.q = p.get("q") || "";
    (p.get("status") || "").split(",").filter(Boolean).forEach(function (v) { state.status.add(v); });
    (p.get("band") || "").split(",").filter(Boolean).forEach(function (v) { state.bands.add(v); });
    (p.get("type") || "").split(",").filter(Boolean).forEach(function (v) { state.types.add(v); });
    if (p.get("sort")) state.sort = p.get("sort");
    if (p.get("dir") === "desc") state.dir = -1;
  }

  function writeUrl() {
    var p = new URLSearchParams();
    if (state.q) p.set("q", state.q);
    if (state.status.size) p.set("status", [...state.status].join(","));
    if (state.bands.size) p.set("band", [...state.bands].join(","));
    if (state.types.size) p.set("type", [...state.types].join(","));
    if (state.sort !== "km") p.set("sort", state.sort);
    if (state.dir === -1) p.set("dir", "desc");
    var qs = p.toString();
    history.replaceState(null, "", qs ? "?" + qs : location.pathname);
    // Keep the back link pointing at the same slice on Explore.
    $("back").setAttribute("href", "index.html" + (qs ? "?" + qs : ""));
  }

  /* ---------- filtering ---------- */

  function haystack(s) {
    return (s.name + " " + (s.types || []).join(" ")).toLowerCase();
  }

  function matches(s) {
    if (state.status.size && !state.status.has(s.status)) return false;
    if (state.bands.size && !state.bands.has(s.distance_band)) return false;
    if (state.types.size && !(s.types || []).some(function (t) { return state.types.has(t); })) return false;
    if (state.q && haystack(s).indexOf(state.q.toLowerCase()) === -1) return false;
    return true;
  }

  function sortValue(s, key) {
    switch (key) {
      case "name":   return s.name.toLowerCase();
      case "km":     return s.distance_km;
      case "band":   return BAND_ORDER[s.distance_band] != null ? BAND_ORDER[s.distance_band] : 99;
      case "status": return s.status === "visited" ? 0 : 1;
      case "types":  return ((s.types || [])[0] || "").toLowerCase();
    }
    return "";
  }

  function sorted(list) {
    var key = state.sort, dir = state.dir;
    return list.slice().sort(function (a, b) {
      var x = sortValue(a, key), y = sortValue(b, key);
      if (x < y) return -1 * dir;
      if (x > y) return 1 * dir;
      // Stable tie-break so equal rows keep a predictable order.
      return a.distance_km - b.distance_km || a.name.localeCompare(b.name);
    });
  }

  function activeFilterCount() {
    return state.status.size + state.bands.size + state.types.size;
  }

  /* ---------- rendering ---------- */

  // Highlight the matched substring without ever injecting HTML from data.
  function highlight(text, q) {
    var frag = document.createDocumentFragment();
    if (!q) { frag.appendChild(document.createTextNode(text)); return frag; }
    var lower = text.toLowerCase(), needle = q.toLowerCase(), from = 0, hit;
    while ((hit = lower.indexOf(needle, from)) !== -1) {
      if (hit > from) frag.appendChild(document.createTextNode(text.slice(from, hit)));
      var m = document.createElement("mark");
      m.textContent = text.slice(hit, hit + needle.length);
      frag.appendChild(m);
      from = hit + needle.length;
    }
    if (from < text.length) frag.appendChild(document.createTextNode(text.slice(from)));
    return frag;
  }

  function mapsUrl(s) {
    return "https://www.google.com/maps/dir/?api=1&destination=" +
           encodeURIComponent(s.maps_query || s.name) + "&travelmode=driving";
  }

  function buildHead() {
    var head = $("head");
    head.replaceChildren();
    COLUMNS.forEach(function (c) {
      var th = document.createElement("th");
      if (c.type === "num") th.className = "num";
      th.scope = "col";
      var on = state.sort === c.key;
      if (on) th.setAttribute("aria-sort", state.dir === 1 ? "ascending" : "descending");
      var b = document.createElement("button");
      b.type = "button";
      b.append(c.label);
      b.appendChild(el("span", "arrow", on ? (state.dir === 1 ? "▲" : "▼") : "▲"));
      b.setAttribute("aria-label", "Sort by " + c.label +
        (on ? (state.dir === 1 ? ", currently ascending" : ", currently descending") : ""));
      b.addEventListener("click", function () {
        if (state.sort === c.key) state.dir *= -1;
        // Text columns open ascending; numbers open descending (biggest first).
        else { state.sort = c.key; state.dir = c.type === "num" ? -1 : 1; }
        render();
      });
      th.appendChild(b);
      head.appendChild(th);
    });
  }

  function buildChips() {
    function group(host, options, set) {
      host.replaceChildren();
      options.forEach(function (o) {
        var b = el("button", "chip", o.label);
        b.type = "button";
        b.setAttribute("aria-pressed", set.has(o.id) ? "true" : "false");
        b.addEventListener("click", function () {
          if (set.has(o.id)) set.delete(o.id); else set.add(o.id);
          render();
        });
        host.appendChild(b);
      });
    }
    group($("f-status"), [{ id: "to-visit", label: "To visit" }, { id: "visited", label: "Visited" }], state.status);
    group($("f-band"), BANDS, state.bands);
    group($("f-type"), allTypes.map(function (t) { return { id: t, label: t }; }), state.types);
  }

  function render() {
    var list = sorted(spots.filter(matches));

    buildHead();
    buildChips();

    var n = activeFilterCount();
    var badge = $("filter-badge");
    badge.hidden = !n;
    badge.textContent = n;

    $("count").textContent = list.length === spots.length
      ? spots.length + " spots"
      : list.length + " of " + spots.length + " spots";
    $("reset").hidden = !(n || state.q);

    var body = $("body");
    body.replaceChildren();

    if (!list.length) {
      var tr = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = COLUMNS.length;
      td.appendChild(el("div", "empty", "Nothing matches. Try a different search or clear a filter."));
      tr.appendChild(td);
      body.appendChild(tr);
      writeUrl();
      return;
    }

    var frag = document.createDocumentFragment();
    list.forEach(function (s) {
      var tr = document.createElement("tr");

      var name = el("td", "name");
      var a = document.createElement("a");
      a.href = mapsUrl(s);
      a.target = "_blank";
      a.rel = "noopener";
      a.appendChild(highlight(s.name, state.q));
      name.appendChild(a);

      var km = el("td", "num", s.distance_km);
      var band = BANDS.find(function (b) { return b.id === s.distance_band; });
      var len = el("td", "len", band ? band.label : s.distance_band);

      var st = el("td");
      st.appendChild(el("span", "pill" + (s.status === "visited" ? " visited" : ""),
                        s.status === "visited" ? "Visited" : "To visit"));

      var ty = el("td", "types");
      ty.appendChild(highlight((s.types || []).join(", "), state.q));

      tr.append(name, km, len, st, ty);
      frag.appendChild(tr);
    });
    body.appendChild(frag);

    writeUrl();
  }

  /* ---------- wiring ---------- */

  $("q").addEventListener("input", function () {
    state.q = this.value.trim();
    render();
  });

  // The toolbar's sticky offset is the global nav's fixed 44px height (app.css),
  // so there's nothing to measure at runtime any more.

  $("filter-toggle").addEventListener("click", function () {
    var open = this.getAttribute("aria-expanded") === "true";
    this.setAttribute("aria-expanded", open ? "false" : "true");
    $("filters").hidden = open;
  });

  $("reset").addEventListener("click", function () {
    state.q = "";
    $("q").value = "";
    state.status.clear(); state.bands.clear(); state.types.clear();
    render();
  });

  readUrl();

  fetch("spots.json")
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) {
      spots = data.spots || [];
      allTypes = [...new Set(spots.flatMap(function (s) { return s.types || []; }))].sort();
      $("q").value = state.q;
      // Open the filter panel if we arrived with filters already applied.
      if (activeFilterCount()) {
        $("filter-toggle").setAttribute("aria-expanded", "true");
        $("filters").hidden = false;
      }
      render();
    })
    .catch(function () {
      $("main").replaceChildren(el("p", "error",
        "Could not load spots.json. If you opened this file directly, run a local web server instead."));
    });
})();
</script>

</body>
</html>
